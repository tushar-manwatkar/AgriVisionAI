services:
  - type: web
    name: plant-disease-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn_config.py app:app
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 2
    healthCheckPath: /api/health